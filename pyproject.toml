[project]
name = "local-tts"
version = "0.1.0"
description = "Local TTS service for coding agents (MOSS-TTS-Local-Transformer-v1.5 first)"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "moss-tts[torch-runtime]",
  # Pinned by moss-tts[torch-runtime]; listed here so uv.sources can route them to the right index.
  "torch==2.9.1+cu128",
  "torchaudio==2.9.1+cu128",
  # CPU build from PyPI: the cu128 build needs NVIDIA NPP (libnppicc), and we only decode audio.
  "torchcodec==0.8.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  "mcp==2.3.0",
]

[project.scripts]
tts-server = "local_tts.server.app:main"
tts = "local_tts.cli:main"
tts-mcp = "local_tts.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_tts"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
moss-tts = { path = "third_party/MOSS-TTS", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The in-process TestClient warns about per-request timeouts, which the real httpx client needs.
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]
